/* Visual refinement: clean surfaces, consistent spacing and stronger contrast. */
:root{color-scheme:light;--paper:#f4f6f9;--sheet:#ffffff;--ink:#202939;--soft:#667085;--line:#e3e8ef;--pen:#a32020;--radius:14px}
:root[data-theme="escuro"]{color-scheme:dark;--paper:#151b24;--sheet:#202a37;--ink:#eef3f8;--soft:#b3bfce;--line:#354252;--pen:#ef8278;--brand-red:#ff766b;--brand-brown:#f3d5b5}
body{background:var(--paper);color:var(--ink);line-height:1.5}
.topbar{background:color-mix(in srgb,var(--sheet) 94%,transparent);border-bottom:1px solid var(--line);box-shadow:0 1px 3px #16202b0a}
.top-inner{min-height:70px}
.menu-toggle,.top-btn{border-radius:10px;border-color:var(--line);transition:background .18s ease,border-color .18s ease,transform .18s ease}
.menu-toggle:hover,.top-btn:hover{background:color-mix(in srgb,var(--paper) 60%,var(--sheet));border-color:color-mix(in srgb,var(--pen) 30%,var(--line))}
.wrap{padding-top:34px}
.page-heading{margin-bottom:24px}
.page-heading h1{font-weight:700;letter-spacing:-.04em}
.page-heading p{line-height:1.6}
.card,.class-card,.task-card,.school-card{box-shadow:0 1px 2px #16202b0a,0 8px 24px #16202b08}
.card{border-radius:var(--radius);padding:20px}
.btn{border-radius:9px;border-color:var(--line);padding:9px 13px;transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.btn:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--pen) 28%,var(--line))}
.btn:active{transform:translateY(0)}
.btn.primary{box-shadow:0 2px 6px color-mix(in srgb,var(--pen) 18%,transparent)}
.input,.select,.textarea{border:1px solid var(--line);border-radius:9px;background:var(--sheet);box-shadow:none;padding:10px 12px;transition:border-color .18s ease,box-shadow .18s ease}
.input:focus,.select:focus,.textarea:focus{border-color:color-mix(in srgb,var(--pen) 55%,var(--line));box-shadow:0 0 0 3px color-mix(in srgb,var(--pen) 12%,transparent);outline:none}
.input::placeholder,.textarea::placeholder{color:var(--soft);opacity:.72}
.school-card{background:color-mix(in srgb,var(--school-accent) 5%,var(--sheet));border-radius:var(--radius);transition:transform .18s ease,box-shadow .18s ease}
.school-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px #16202b12,0 0 0 1px color-mix(in srgb,var(--school-accent) 24%,var(--line))}
.school-card-open{padding:18px}
.school-name,.class-card strong{font-weight:700;letter-spacing:-.01em}
.class-card{border:1px solid var(--line);border-radius:12px;padding:17px;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.class-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--pen) 35%,var(--line));box-shadow:0 7px 18px #16202b10}
.class-card-open{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;min-width:0;padding:0;border:0;background:transparent;text-align:left;color:var(--ink)}
.class-card-copy{min-width:0}.class-card-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.class-card-copy span{margin-top:4px!important}.class-card-arrow{flex:none!important;margin:0!important;color:var(--pen)!important;font:18px/1 var(--sans)!important}
.class-card-actions{display:flex;align-items:center;gap:4px;padding-left:8px;border-left:1px solid var(--line)}
.icon-action{display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--soft);transition:background .15s ease,color .15s ease,border-color .15s ease}
.icon-action svg{width:18px;height:18px}.icon-action:hover{background:color-mix(in srgb,var(--paper) 60%,var(--sheet));border-color:var(--line);color:var(--ink)}.icon-action.danger:hover{background:color-mix(in srgb,var(--pen) 9%,var(--sheet));color:var(--pen);border-color:color-mix(in srgb,var(--pen) 24%,var(--line))}
.archived-class-section{margin-top:28px}.archived-class-list{display:grid;gap:8px}.archived-class-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--paper) 48%,var(--sheet))}.archived-class-row>div{display:grid;gap:3px;min-width:0}.archived-class-row strong{font-size:13px}.archived-class-row span{color:var(--soft);font:11px var(--mono)}
.import-mode-choice{display:grid;gap:8px;margin:4px 0 0;padding:0;border:0;min-width:0}.import-mode-choice legend{margin-bottom:4px;padding:0}.import-mode-option{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--paper) 38%,var(--sheet));cursor:pointer}.import-mode-option.selected{border-color:color-mix(in srgb,var(--pen) 55%,var(--line));background:color-mix(in srgb,var(--pen) 5%,var(--sheet))}.import-mode-option input{margin:3px 0 0;accent-color:var(--pen);flex:none}.import-mode-option span{display:grid;gap:3px}.import-mode-option strong{font-size:13px}.import-mode-option small{color:var(--soft);font-size:12px;line-height:1.4}
.empty{border-radius:12px;border-color:color-mix(in srgb,var(--line) 80%,transparent);padding:28px;background:color-mix(in srgb,var(--sheet) 76%,var(--paper))}
.group-select-all,.group-class-option,.hidden-school-row,.student-summary,.occurrence-card{border-radius:10px;background:color-mix(in srgb,var(--paper) 54%,var(--sheet))}
.group-class-option{box-shadow:0 0 0 1px var(--line);transition:background .15s ease,box-shadow .15s ease}
.group-class-option:hover{background:color-mix(in srgb,var(--pen) 5%,var(--sheet));box-shadow:0 0 0 1px color-mix(in srgb,var(--pen) 32%,var(--line))}
.student-summary{border:1px solid var(--line);padding:14px 16px}
.student-manage-row,.student-row{border-radius:9px;background:color-mix(in srgb,var(--paper) 48%,var(--sheet))}
.student-row{padding:10px 12px}
.student-chip{background:var(--sheet);border-color:var(--line);padding:5px 10px}
.tabs{gap:7px;border-color:var(--line)}
.tab{border-radius:9px 9px 0 0;padding:10px 15px}
.tab.active{box-shadow:0 2px 5px color-mix(in srgb,var(--pen) 18%,transparent)}
.task-card{border-radius:12px}
.task-card-head{padding:15px 17px;background:color-mix(in srgb,var(--paper) 55%,var(--sheet))}
.task-students{padding:10px 15px 16px;gap:8px}
.attendance-row{padding:11px 13px}
.occurrence-card{box-shadow:0 0 0 1px var(--line)}
.overlay{background:rgba(15,23,42,.48);backdrop-filter:blur(3px)}
.dialog{border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:16px;box-shadow:0 24px 70px #0003;padding:24px}
.settings-drawer{border-radius:0 16px 16px 0}
.toast{border-radius:11px;padding:12px 16px;box-shadow:0 8px 24px #0003}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--pen) 42%,transparent);outline-offset:2px}
.school-export{width:44px;flex:none;display:grid;place-items:center;border:0;border-left:1px solid var(--line);background:transparent;color:var(--soft);transition:background .15s ease,color .15s ease}.school-export:hover{background:color-mix(in srgb,var(--pen) 8%,var(--sheet));color:var(--pen)}.school-export svg{width:19px;height:19px}
@media(max-width:760px){.wrap{padding-top:26px}.card{padding:16px}.dialog{padding:20px}}
@media(max-width:480px){.dialog{border-radius:0;padding:18px}.school-card-open{padding:15px}}
</style>
</head>

<script>
(()=>{'use strict';
const KEY='caderneta-estado-v1',THEME_KEY='classcontrol-theme-v1',SAVE_META_KEY='caderneta-estado-v1-saved-at',DB_NAME='classcontrol-autosave-v1',DB_STORE='snapshots',DB_RECORD='current';
const base={arquivo:null,escola:'',turma:'',alunos:[],atividades:[],registros:{},faltas:{},gruposSalvos:[],ocorrencias:[],escolasOcultas:[],turmasOcultas:[]};
const $=id=>document.getElementById(id), id=()=>Math.random().toString(36).slice(2,10), localDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let state=load(),view='home',selectedSchool='',selectedClass='',activeTab='Atividade',pendingFile=null,manualOpen=false,showHiddenSchools=false,addStudentOpen=false,editStudentsOpen=false,attendanceDate=localDate(),toastTimer,sheetPromise=null,currentTheme='claro',dbPromise=null,backupTimer=null,pendingBackup=null,backupQueue=Promise.resolve(),startupReady=false;try{currentTheme=localStorage.getItem(THEME_KEY)||'claro'}catch{}currentTheme=currentTheme==='escuro'?'escuro':'claro';document.documentElement.dataset.theme=currentTheme;
function load(){try{return {...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...base}}}
function openStateDB(){if(!window.indexedDB)return Promise.resolve(null);if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const request=window.indexedDB.open(DB_NAME,1);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error('Falha no armazenamento local'));request.onblocked=()=>reject(new Error('Armazenamento local ocupado'))});return dbPromise}
function writeStateBackup(item){return openStateDB().then(db=>{if(!db)return;return new Promise((resolve,reject)=>{let tx;try{tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put(item,DB_RECORD)}catch(error){reject(error);return}tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Falha ao salvar'));tx.onabort=()=>reject(tx.error||new Error('Salvamento cancelado'))})})}
